name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Create assets directories
        run: |
          mkdir -p assets/images
          mkdir -p assets/fonts

      - name: Download Cairo Font
        run: |
          curl -L "https://github.com/google/fonts/raw/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" -o assets/fonts/Cairo-Regular.ttf || \
          curl -L "https://fonts.gstatic.com/s/cairo/v28/SLXgc1nY6HkvalIhTps.ttf" -o assets/fonts/Cairo-Regular.ttf || \
          cp assets/fonts/Cairo-Regular.ttf assets/fonts/Cairo-Bold.ttf || true

      - name: Copy font for bold if needed
        run: |
          if [ ! -f assets/fonts/Cairo-Bold.ttf ]; then
            cp assets/fonts/Cairo-Regular.ttf assets/fonts/Cairo-Bold.ttf
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dawwar-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build APK (debug) as fallback
        if: failure()
        run: flutter build apk --debug

      - name: Upload Debug APK
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dawwar-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
