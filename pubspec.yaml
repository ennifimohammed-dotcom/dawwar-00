name: dawwar
description: تطبيق دوّار - إدارة الجمعيات المالية
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Database
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # State Management
  provider: ^6.1.1
  
  # UI
  flutter_slidable: ^3.0.1
  fl_chart: ^0.66.2
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  
  # Utils
  intl: ^0.19.0
  share_plus: ^7.2.1
  flutter_local_notifications: ^17.0.0
  uuid: ^4.3.3
  
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
